name: Internal iOS static XCFramework validation
'on':
  push:
    branches: [checkpoint/madobs-ios-xcframework-preview, checkpoint/madobs-ios-runtime-isolation]
permissions:
  contents: read
jobs:
  package-independent-consumer:
    if: github.ref == 'refs/heads/checkpoint/madobs-ios-xcframework-preview' || github.ref == 'refs/heads/checkpoint/madobs-ios-runtime-isolation'
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Exact source and local structural checks
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 ios-xcframework/test_verify.py
          python3 scripts/test-ios-validation-results.py
          python3 ios-xcframework/test_isolation.py
      - name: Internal package, device link and actual simulator XCTest
        run: |
          if [ "$GITHUB_REF" = refs/heads/checkpoint/madobs-ios-runtime-isolation ]; then
            python3 ios-xcframework/verify.py --runtime-isolation
          else
            python3 ios-xcframework/verify.py
          fi
